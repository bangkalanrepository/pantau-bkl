      /* ------------------------------------------------------------------ */
      /* 3. Utilitas format                                                 */
      /* ------------------------------------------------------------------ */
      function isFiniteNumber(v) {
        return typeof v === "number" && Number.isFinite(v);
      }
      function safeString(v) {
        return typeof v === "string" && v.trim().length > 0 ? v : undefined;
      }
      function formatNumber(value, maximumFractionDigits) {
        if (!isFiniteNumber(value)) return undefined;
        if (maximumFractionDigits === undefined) maximumFractionDigits = 1;
        try {
          return new Intl.NumberFormat("id-ID", {
            maximumFractionDigits,
          }).format(value);
        } catch {
          return String(Math.round(value * 100) / 100);
        }
      }
      function formatWithUnit(value, unit, digits) {
        var num = formatNumber(value, digits);
        return num === undefined ? undefined : num + " " + unit;
      }
      function formatTemperatureShort(value) {
        if (!isFiniteNumber(value)) return undefined;
        return Math.round(value) + "°C";
      }
      function formatPercent(value) {
        if (!isFiniteNumber(value)) return undefined;
        return Math.round(value) + "%";
      }
      function formatOptions(dateStyle, timeStyle) {
        var o = {
          dateStyle: dateStyle,
          timeZone: DISPLAY_TIME_ZONE,
          localeMatcher: "lookup",
        };
        if (timeStyle) o.timeStyle = timeStyle;
        return o;
      }
      function formatDateTime(iso) {
        var raw = safeString(iso);
        if (raw === undefined) return undefined;
        var date = new Date(raw);
        if (isNaN(date.getTime())) return undefined;
        try {
          return new Intl.DateTimeFormat(
            "id-ID",
            formatOptions("long", "short"),
          ).format(date);
        } catch {
          return undefined;
        }
      }
      function formatTime(iso) {
        var raw = safeString(iso);
        if (raw === undefined) return undefined;
        var date = new Date(raw);
        if (isNaN(date.getTime())) return undefined;
        try {
          var time = new Intl.DateTimeFormat("id-ID", {
            hour: "2-digit",
            minute: "2-digit",
            timeZone: DISPLAY_TIME_ZONE,
          }).format(date);
          return time + " WIB";
        } catch {
          return undefined;
        }
      }
      function formatClock(iso) {
        var raw = safeString(iso);
        if (raw === undefined) return undefined;
        var date = new Date(raw);
        if (isNaN(date.getTime())) return undefined;
        try {
          var time = new Intl.DateTimeFormat("id-ID", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            timeZone: DISPLAY_TIME_ZONE,
          }).format(date);
          return time + " WIB";
        } catch {
          return undefined;
        }
      }
      function parseBmkgLocalDateTime(value) {
        var raw = safeString(value);
        if (!raw) return undefined;
        var normalized = raw.indexOf("T") !== -1 ? raw : raw.replace(" ", "T");
        var withOffset = /[Zz]|[+-]\d{2}:?\d{2}$/.test(normalized)
          ? normalized
          : normalized + "+07:00";
        var date = new Date(withOffset);
        return isNaN(date.getTime()) ? undefined : date;
      }

      /* ------------------------------------------------------------------ */
      /* 4. Utilitas angin                                                  */
      /* ------------------------------------------------------------------ */
      var COMPASS_POINTS = [
        "Utara",
        "Timur Laut",
        "Timur",
        "Tenggara",
        "Selatan",
        "Barat Daya",
        "Barat",
        "Barat Laut",
      ];
      function getWindDirection(degree) {
        if (typeof degree !== "number" || !isFiniteNumber(degree))
          return undefined;
        var normalized = ((degree % 360) + 360) % 360;
        return COMPASS_POINTS[
          Math.round(normalized / 45) % COMPASS_POINTS.length
        ];
      }
      function normalizeDeg(degree) {
        return ((degree % 360) + 360) % 360;
      }
      var WIND_SECTORS = [
        { name: "Utara", ideal: 0, range: "337,5° – 22,5°" },
        { name: "Timur Laut", ideal: 45, range: "22,5° – 67,5°" },

      /* ------------------------------------------------------------------ */
      /* 5. Kategori AQI (satu sumber warna & label)                        */
      /* ------------------------------------------------------------------ */
      var US_BANDS = [
        {
          max: 50,

      var EUROPE_BANDS = [

        {

        },
        {

          label: "Ekstrem Buruk",

          dot: "bg-rose-800",
          color: "#9f1239",
        },
      ];
      function getAqiStatus(aqi, scale) {
        if (typeof aqi !== "number" || !isFiniteNumber(aqi)) return undefined;
        var bands = scale === "europe" ? EUROPE_BANDS : US_BANDS;
        var band =
          bands.find(function (item) {
            return aqi <= item.max;
          }) || bands[bands.length - 1];
        return {
          level: bands.indexOf(band),
          label: band.label,
          description: band.description,
          badge: band.badge,
          dot: band.dot,
          color: band.color,
        };
      }

      /* ------------------------------------------------------------------ */
      /* 6. Insight kualitas udara (bahasa awam)                            */
      /* ------------------------------------------------------------------ */
      var POLLUTANT_SPECS = [
        {
          key: "pm25",
          label: "PM2.5",
          value: function (d) {
            return d.pm25;
          },
          threshold: 15,
        },
        {
          key: "pm10",
          label: "PM10",
          value: function (d) {
            return d.pm10;
          },
          threshold: 45,
        },
        {
          key: "ozone",
          label: "Ozon (O₃)",
          value: function (d) {
            return d.ozone;
          },
          threshold: 100,
        },
        {
          key: "no2",
          label: "Nitrogen Dioksida (NO₂)",
          value: function (d) {
            return d.nitrogenDioxide;
          },
          threshold: 25,
        },
        {
          key: "so2",
          label: "Sulfur Dioksida (SO₂)",
          value: function (d) {
            return d.sulphurDioxide;
          },
          threshold: 40,
        },
        {
          key: "co",
          label: "Karbon Monoksida (CO)",
          value: function (d) {
            return d.carbonMonoxide;
          },
          threshold: 4000,
        },
      ];
      function findDominant(data) {
        var best;
        for (var i = 0; i < POLLUTANT_SPECS.length; i++) {
          var spec = POLLUTANT_SPECS[i];
          var value = spec.value(data);
          if (typeof value !== "number" || !isFiniteNumber(value)) continue;
          var ratio = value / spec.threshold;
          var bestRatio =
            best === undefined
              ? Number.NEGATIVE_INFINITY
              : best.value / best.spec.threshold;
          if (ratio > bestRatio) best = { spec: spec, value: value };
        }
        if (best === undefined) return undefined;
        return {
          label: best.spec.label,
          value: best.value,
          threshold: best.spec.threshold,
          exceeds: best.value > best.spec.threshold,
        };
      }
      function uvLabel(uv) {
        if (!isFiniteNumber(uv)) return undefined;
        if (uv < 3) return "rendah";
        if (uv < 6) return "sedang";
        if (uv < 8) return "tinggi";
        if (uv < 11) return "sangat tinggi";
        return "ekstrem";
      }
      function adviceFor(level) {
        switch (level) {
          case 0:
            return "Aman untuk beraktivitas di luar ruang tanpa batasan.";
          case 1:
            return "Masih aman bagi kebanyakan orang; hanya kelompok yang sangat sensitif perlu waspada bila beraktivitas luar ruang dalam waktu lama.";
          case 2:
            return "Anak-anak, lansia, ibu hamil, serta penderita asma atau penyakit jantung sebaiknya mengurangi aktivitas fisik di luar ruangan.";
          case 3:
            return "Sebaiknya kurangi aktivitas di luar ruang; gunakan masker bila harus beraktivitas di luar.";
          case 4:
            return "Hindari aktivitas di luar ruang dan manfaatkan pemurni udara bila tersedia.";
          case 5:
            return "Kondisi darurat: tetap berada di dalam ruangan dan ikuti imbauan otoritas kesehatan.";
          default:
            return "Pantau perkembangan kualitas udara secara berkala.";
        }
      }
      function buildAirQualityInsight(data) {
        var status = getAqiStatus(data.usAqi);
        var sentences = [];
        var aqiText =
          data.usAqi !== undefined ? formatNumber(data.usAqi, 0) : undefined;
        var headline =
          status !== undefined
            ? "Kualitas udara: " +
              status.label +
              (aqiText !== undefined ? " (US AQI " + aqiText + ")" : "")
            : aqiText !== undefined
              ? "US AQI " + aqiText
              : "Kualitas Udara";
        var dominant = findDominant(data);
        if (dominant !== undefined) {
          var valueText = formatNumber(dominant.value) + " µg/m³";
          if (dominant.exceeds) {
            sentences.push(
              "Polutan paling menonjol saat ini adalah " +
                dominant.label +
                " sebesar " +
                valueText +
                ", sudah melewati ambang acuan harian (" +
                formatNumber(dominant.threshold) +
                " µg/m³).",
            );
          } else {
            sentences.push(
              "Polutan paling menonjol saat ini adalah " +
                dominant.label +
                " sebesar " +
                valueText +
                " — masih di bawah ambang acuan harian (" +
                formatNumber(dominant.threshold) +
                " µg/m³).",
            );
          }
        } else if (status === undefined) {
          sentences.push("Data parameter polutan belum tersedia saat ini.");
        }
        if (status !== undefined && dominant !== undefined) {
          if (status.level <= 1 && !dominant.exceeds) {
            sentences.push(
              "Secara umum udara masih tergolong bersih dan nyaman untuk ditarik napas.",
            );
          } else if (dominant.exceeds && status.level >= 2) {
            sentences.push(
              "Artinya, orang yang sensitif bisa mulai merasakan gangguan seperti batuk atau sesak ketika terlalu lama di luar ruangan.",
            );
          }
        }
        if (data.uvIndex !== undefined && data.uvIndex >= 6) {
          var label = uvLabel(data.uvIndex) || "";
          sentences.push(
            (
              "Indeks UV saat ini tergolong " +
              label +
              " (" +
              formatNumber(data.uvIndex) +
              ") — gunakan pelindung matahari bila beraktivitas di luar ruang."
            )
              .replace(/\s+/g, " ")
              .trim(),
          );
        }
        var level = status ? status.level : undefined;
        sentences.push(adviceFor(level));
        return { headline: headline, sentences: sentences };
      }

      /* ------------------------------------------------------------------ */
      /* 7. Parser cuaca BMKG                                               */
      /* ------------------------------------------------------------------ */
      function isObject(v) {

      /* ------------------------------------------------------------------ */
      /* 18. Komponen: MapView (Leaflet imperatif)                          */
      /* ------------------------------------------------------------------ */
      function MapView(props) {
        var React5 = window.React;
        var useEffect = React5.useEffect,
          useRef = React5.useRef;
        var locations = props.locations,
          dataMap = props.dataMap,
          selectedId = props.selectedId,
          onSelect = props.onSelect;
        var containerRef = useRef(null);
        var mapRef = useRef(null);
        var markersRef = useRef({});
        var selectedRef = useRef(selectedId);
        selectedRef.current = selectedId;
        var selectedDeg =
          selectedId && dataMap[selectedId] && dataMap[selectedId].weather
            ? dataMap[selectedId].weather.windDirectionDeg
            : undefined;

        function buildWindArrowHTML(degree) {
          if (typeof degree !== "number" || !isFiniteNumber(degree)) return "";
          var normalized = normalizeDeg(degree);
          var toLabel = getWindDirection(normalized);
          return (
            '<span class="inline-flex shrink-0 h-3 w-3 text-slate-500" style="display:inline-flex" title="Angin menuju: ' +
            toLabel +
            " · " +
            normalized.toFixed(1) +
            '°">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="h-full w-full" style="transform:rotate(' +
            normalized +
            'deg)">' +
            '<path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></span>'
          );
        }

        function buildTooltip(location, data) {
          var aqiStatus = data
            ? getAqiStatus(data.airQuality.usAqi)
            : undefined;
          var weather = data ? data.weather : undefined;
          var top =
            '<div class="flex items-center gap-1.5">' +
            (aqiStatus
              ? '<span class="h-2 w-2 shrink-0 rounded-full" style="background-color:' +
                aqiStatus.color +
                '" aria-hidden="true"></span>'
              : "") +
            '<span class="text-[13px] font-semibold leading-tight text-slate-900">' +
            location.name +
            "</span></div>";
          var body;
          if (!data) {
            body =
              '<div class="mt-1 flex items-center gap-1 text-[11px] font-medium text-sky-700">' +
              '<span class="inline-block h-3 w-3 animate-spin rounded-full border-2 border-sky-200 border-t-sky-600" aria-hidden="true"></span>' +
              "Memuat data...</div>";
          } else if (
            data.errors !== undefined &&
            weather &&
            weather.temperature === undefined
          ) {
            body =
              '<div class="mt-1 text-[11px] font-medium text-red-600">Data gagal dimuat</div>';
          } else {
            var temp =
              weather && weather.temperature !== undefined
                ? formatTemperatureShort(weather.temperature)
                : "–";
            var hum =
              weather && weather.humidity !== undefined
                ? formatPercent(weather.humidity)
                : "–";
            var wind =
              weather && weather.windSpeed !== undefined
                ? formatWithUnit(weather.windSpeed, "km/j")
                : "–";
            var windChunk =
              weather &&
              (weather.windDirectionText ||
                weather.windDirectionDeg !== undefined)
                ? '<span class="mx-0.5 text-slate-300" aria-hidden="true">|</span>' +
                  buildWindArrowHTML(weather.windDirectionDeg) +
                  (weather.windDirectionText || "")
                : "";
            body =
              '<div class="mt-1 space-y-0.5">' +
              '<div class="flex items-center gap-1 text-[11px] leading-tight text-slate-700">' +
              svgIcon("thermometer", "h-3 w-3 text-amber-600") +
              temp +
              '<span class="mx-0.5 text-slate-300" aria-hidden="true">|</span>' +
              svgIcon("droplets", "h-3 w-3 text-cyan-600") +
              hum +
              "</div>" +
              '<div class="flex items-center gap-1 text-[11px] leading-tight text-slate-700">' +
              svgIcon("wind", "h-3 w-3 text-sky-600") +
              wind +
              windChunk +
              "</div></div>";
          }
          return (
            '<div class="min-w-[7.5rem] text-left">' + top + body + "</div>"
          );
        }

        function svgIcon(name, className) {
          var nodes = (ICON_PATHS[name] || [])
            .map(function (node) {
              if (node[0] === "circle")
                return (
                  '<circle cx="' +
                  node[1].cx +
                  '" cy="' +
                  node[1].cy +
                  '" r="' +
                  node[1].r +
                  '"/>'
                );
              return '<path d="' + node[1].d + '"/>';
            })
            .join("");
          return (
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' +
            className +
            '" aria-hidden="true">' +
            nodes +
            "</svg>"
          );
        }

        // Inisialisasi peta sekali
        useEffect(function () {
          var map = L.map(containerRef.current, {
            center: DEFAULT_MAP_CENTER,
            zoom: DEFAULT_MAP_ZOOM,
            scrollWheelZoom: true,
          });
          L.tileLayer(MAP_TILE_URL, {
            attribution: MAP_TILE_ATTRIBUTION,
            crossOrigin: true,
          }).addTo(map);

          mapRef.current = map;
          var bounds = L.latLngBounds(
            locations.map(function (l) {
              return [l.latitude, l.longitude];
            }),
          );
          // map.fitBounds(bounds.pad(0.18), { animate: false });
          var observer = new ResizeObserver(function () {
            map.invalidateSize({ animate: false });
          });
          observer.observe(containerRef.current);
          return function () {
            observer.disconnect();
            map.remove();
            mapRef.current = null;
            markersRef.current = {};
          };
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        // Buat/perbarui marker saat data/selection berubah
        useEffect(
          function () {
            var map = mapRef.current;
            if (!map) return;
            locations.forEach(function (location) {
              var data = dataMap[location.id];
              var selected = selectedRef.current === location.id;
              var aqiStatus = data
                ? getAqiStatus(data.airQuality.usAqi)
                : undefined;
              var pinColor = selected
                ? "#0c4a6e"
                : aqiStatus
                  ? aqiStatus.color
                  : "#0284c7";
              var icon = L.divIcon({
                className: "pantau-marker",
                html:
                  '<span class="pantau-pin' +
                  (selected ? " pantau-pin-selected" : "") +
                  '" style="--pin-color:' +
                  pinColor +
                  '"></span>',
                iconSize: [20, 20],
                iconAnchor: [10, 10],
              });
              var m = markersRef.current[location.id];
              if (!m) {
                m = L.marker([location.latitude, location.longitude], {
                  icon: icon,
                  zIndexOffset: selected ? 1000 : 0,
                }).addTo(map);
                m.on("click", function () {
                  document.dispatchEvent(
                    new CustomEvent("pantau-select", { detail: location.id }),
                  );
                });
                m.bindTooltip(buildTooltip(location, data), {
                  permanent: true,
                  direction: "top",
                  offset: [0, -12],
                  opacity: 1,
                  className: "pantau-tooltip",
                  interactive: false,
                });
                markersRef.current[location.id] = m;
              } else {
                m.setIcon(icon);
                m.setZIndexOffset(selected ? 1000 : 0);
                m.setTooltipContent(buildTooltip(location, data));
              }
            });
          },
          [locations, dataMap, selectedId],
        );

        return h(
          "div",
          { className: "relative h-full w-full" },
          h(
            "div",
            { className: "absolute bottom-14 left-3 z-[1100] sm:bottom-16" },
            h(WindDegreeGuide, { variant: "chip", degree: selectedDeg }),
          ),
          h("div", {
            ref: containerRef,
            className: "z-0 h-full w-full",
            style: { position: "relative" },
          }),
        );
      }

      /* ------------------------------------------------------------------ */
      /* 19. Aplikasi utama                                                 */
      /* ------------------------------------------------------------------ */
      function App() {
        var React6 = window.React;
        var useState = React6.useState,
          useCallback = React6.useCallback,
          useEffect = React6.useEffect;
        var weather = useWeatherData(LOCATIONS);
        var dataMap = weather.dataMap,
          isLoading = weather.isLoading,
          isRefreshing = weather.isRefreshing,
          lastUpdated = weather.lastUpdated,
          refresh = weather.refresh;
        var _a = useState(LOCATIONS[0] ? LOCATIONS[0].id : null),
          selectedId = _a[0],
          setSelectedId = _a[1];

        var handleSelect = useCallback(function (id) {
          setSelectedId(id);
        }, []);
        var handleClose = useCallback(function () {
          setSelectedId(null);
        }, []);

        // Terima peristiwa pilih dari peta (event di-dispatch dari MapView)
        useEffect(function () {
          function onSelectEvent(event) {
            setSelectedId(event.detail);
          }
          document.addEventListener("pantau-select", onSelectEvent);
          return function () {
            document.removeEventListener("pantau-select", onSelectEvent);
          };
        }, []);

        useEffect(
          function () {
            if (selectedId === null) return;
            var el = document.getElementById("panel-detail-mobile");
            if (el !== null && typeof el.scrollIntoView === "function") {
              if (!window.matchMedia("(min-width: 1024px)").matches) {
                el.scrollIntoView({ behavior: "smooth", block: "start" });
              }
            }
          },
          [selectedId],
        );

        var selectedEntry =
          selectedId !== null ? dataMap[selectedId] : undefined;

        var sidebar = h(
          "div",
          { className: "hidden min-h-0 lg:block" },
          selectedEntry !== undefined
            ? h(LocationDetail, {
                entry: selectedEntry,
                isLoading: isLoading,
                onClose: handleClose,
              })
            : h(
                "div",
                {
                  className:
                    "grid h-full place-items-center rounded-xl border-2 border-dashed border-slate-200 bg-white/60 p-6 text-center",
                },
                h(
                  "div",
                  { className: "max-w-xs space-y-2 text-slate-400" },
                  h(
                    "span",
                    { className: "mx-auto grid h-8 w-8 place-items-center" },
                    h(Icon, {
                      name: "mousePointerClick",
                      className: "h-8 w-8",
                    }),
                  ),
                  h(
                    "p",
                    { className: "text-sm font-medium text-slate-600" },
                    "Pilih penanda di peta",
                  ),
                  h(
                    "p",
                    { className: "text-xs leading-relaxed" },
                    "Klik salah satu titik lokasi untuk melihat detail cuaca, kualitas udara, dan informasi wilayah.",
                  ),
                ),
              ),
        );

        var mobileDetail =
          selectedEntry !== undefined
            ? h(
                "div",
                { id: "panel-detail-mobile", className: "h-[70vh] lg:hidden" },
                h(LocationDetail, {
                  entry: selectedEntry,
                  isLoading: isLoading,
                  onClose: handleClose,
                }),
              )
            : null;

        return h(
          "div",
          {
            className:
              "flex min-h-screen flex-col bg-slate-100 lg:h-dvh lg:overflow-hidden",
          },
          h(Header, {
            onRefresh: refresh,
            isRefreshing: isRefreshing,
            lastUpdated: lastUpdated,
          }),
          h(
            "div",
            {
              className:
                "shrink-0 px-3 pt-4 sm:px-4",
            },
            h(SummaryCards, {
              locations: LOCATIONS,
              dataMap: dataMap,
              isLoading: isLoading,
            }),
          ),
          h(
            "main",
            {
              className:
                "flex min-h-0 w-full flex-1 flex-col gap-4 px-3 py-4 sm:px-4 lg:grid lg:grid-cols-[minmax(340px,400px)_minmax(0,1fr)]",
            },
            sidebar,
            h(
              "section",
              {
                "aria-label": "Peta pemantauan",
                className:
                  "h-[55vh] min-h-95 shrink-0 overflow-hidden rounded-xl border border-slate-200 shadow-sm lg:h-full lg:min-h-0",
              },
              h(MapView, {
                locations: LOCATIONS,
                dataMap: dataMap,
                selectedId: selectedId,
                onSelect: handleSelect,
              }),
            ),
            mobileDetail,
          ),
        );
      }

      /* ------------------------------------------------------------------ */
      /* 20. Mount React                                                    */
      /* ------------------------------------------------------------------ */
      var rootElement = document.getElementById("root");
      window.ReactDOM.createRoot(rootElement).render(h(App));
    </script>
  </body>
</html>
